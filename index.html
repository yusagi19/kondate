<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>献立アプリ</title>
<style>
:root{
  --p:#43A047;--pd:#2E7D32;--pl:#A5D6A7;--bg:#F1F8E9;
  /* alias used by external references / theme system */
  --primary:var(--p);--primary-dark:var(--pd);--primary-light:var(--pl);
  --card:#fff;--text:#212121;--t2:#757575;--bd:#E0E0E0;
  --r:12px;--rs:8px;--sh:0 1px 4px rgba(0,0,0,.1);--shm:0 3px 10px rgba(0,0,0,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
.hdr{background:var(--p);color:#fff;padding:10px 14px;display:flex;align-items:center;
  position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  z-index:300;box-shadow:var(--shm)}
.hdr h1{font-size:17px;font-weight:700}

/* ── TABS (bottom fixed, centered within 480px) ── */
.tabs{background:#fff;display:flex;border-top:1px solid var(--bd);
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;z-index:299;
  box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.tab{flex:1;padding:6px 2px 8px;text-align:center;cursor:pointer;
  border-top:3px solid transparent;transition:all .2s;
  display:flex;flex-direction:column;align-items:center;gap:1px}
.tab .ti{font-size:20px}.tab .tl{font-size:10px}
.tab.active{color:var(--p);border-top-color:var(--p);font-weight:700}

/* ── CONTENT ── */
.view{padding:10px;max-width:480px;margin:0 auto;margin-top:54px;padding-bottom:80px}

/* ── WEEK NAV ── */
.wknav{background:#fff;border-radius:var(--r);box-shadow:var(--sh);
  padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wk-label{font-size:13px;font-weight:700;flex:1;text-align:center}
.wkb{border:1px solid var(--bd);border-radius:var(--rs);padding:4px 9px;
  background:#fff;cursor:pointer;font-size:12px;white-space:nowrap;transition:all .2s}
.wkb:hover{background:var(--bg)}
.wkb.gen{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;font-weight:600}
.wkb.gen:hover{opacity:.88}
.wkb.gen:disabled{opacity:.5;cursor:wait}
.wkb.today{background:var(--p);color:#fff;border-color:var(--p)}
.wkb.today:hover{background:var(--pd)}

/* ── DAY CARDS (vertical) ── */
.day-cards{display:flex;flex-direction:column;gap:10px}
.day-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  overflow:hidden;cursor:pointer;transition:box-shadow .2s}
.day-card:hover{box-shadow:var(--shm)}
.day-card-hdr{background:var(--p);color:#fff;padding:7px 12px;
  display:flex;align-items:center;justify-content:space-between}
.day-card-hdr.today{background:#E53935}
.day-name{font-size:13px;font-weight:700}
.day-hint{font-size:10px;opacity:.8}
.meal-slots{padding:2px 0}
.meal-slot{display:flex;align-items:center;padding:6px 12px;
  border-bottom:1px solid var(--bd);gap:8px;min-height:38px}
.meal-slot:last-child{border-bottom:none}
.slot-type{font-size:10px;color:var(--t2);font-weight:600;min-width:30px}
.slot-img{width:28px;height:28px;border-radius:4px;object-fit:cover;flex-shrink:0}
.slot-rname{flex:1;font-size:12px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--p);cursor:pointer;padding:2px 0}
.slot-rname:hover{text-decoration:underline}
.slot-empty{flex:1;font-size:11px;color:var(--t2)}
.slot-del{width:20px;height:20px;border:none;background:none;
  color:#ccc;cursor:pointer;font-size:13px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.slot-del:hover{background:#ffeeee;color:#f44336}

/* ── SHOPPING ── */
.shop-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.shop-top h2{font-size:15px}
.shop-top-r{display:flex;gap:6px;align-items:center}
.progress-text{font-size:11px;color:var(--t2)}
.cat-sec{background:var(--card);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--sh);margin-bottom:8px}
.cat-hdr{background:var(--pl);padding:6px 12px;font-size:12px;font-weight:700;
  display:flex;justify-content:space-between;align-items:center;color:var(--pd)}
.shop-row{display:flex;align-items:center;padding:7px 12px;
  border-bottom:1px solid var(--bd);gap:8px}
.shop-row:last-child{border-bottom:none}
.shop-row.done .sname{text-decoration:line-through;color:var(--t2)}
.shop-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--p);flex-shrink:0;cursor:pointer}
.sname{flex:1;font-size:13px}
.samt{font-size:11px;color:var(--t2);white-space:nowrap}
.scat-sel{font-size:11px;padding:2px 4px;border:1px solid var(--bd);border-radius:4px;
  background:#fff;cursor:pointer;outline:none;color:var(--t2)}
.sdel{width:22px;height:22px;border:none;background:none;color:#ccc;
  cursor:pointer;font-size:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.sdel:hover{background:#ffeeee;color:#f44336}
.add-row{background:var(--card);border-radius:var(--r);padding:10px 12px;
  box-shadow:var(--sh);margin-top:8px}
.add-row h3{font-size:12px;margin-bottom:6px;color:var(--t2)}
.add-form{display:flex;gap:6px}
.add-form input{flex:1;padding:6px 8px;border:1px solid var(--bd);border-radius:var(--rs);font-size:12px;outline:none}
.add-form input:focus{border-color:var(--p)}

/* ── RECIPE BOOK ── */
.rb-top{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.rb-search{flex:1;padding:8px 12px;border:1px solid var(--bd);border-radius:var(--rs);font-size:13px;outline:none}
.rb-search:focus{border-color:var(--p)}
.rb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rcard{background:var(--card);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--sh);cursor:pointer;transition:transform .2s,box-shadow .2s}
.rcard:hover{transform:translateY(-2px);box-shadow:var(--shm)}
.rcard-img{width:100%;height:90px;object-fit:cover;background:#E8F5E9;
  display:flex;align-items:center;justify-content:center;font-size:32px}
.rcard-body{padding:8px}
.rcard-name{font-size:12px;font-weight:600;margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:600}
.b-main{background:#FF8A65;color:#fff}.b-side{background:#81C784;color:#fff}
.b-rice{background:#FFD54F;color:#333}.b-soup{background:#64B5F6;color:#fff}

/* ── FAB ── */
.fab{position:fixed;right:max(18px,calc(50vw - 222px));bottom:72px;width:52px;height:52px;
  background:var(--p);color:#fff;border:none;border-radius:50%;
  font-size:26px;cursor:pointer;box-shadow:var(--shm);
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s;z-index:200}
.fab:hover{background:var(--pd);transform:scale(1.06)}
.fab.hidden{display:none}

/* ── SETTINGS ── */
.sec{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:10px}
.sec h3{font-size:14px;font-weight:700;margin-bottom:11px;color:var(--pd)}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:11px;font-weight:600;margin-bottom:3px;color:var(--t2)}
.fc{width:100%;padding:7px 10px;border:1px solid var(--bd);border-radius:var(--rs);
  font-size:13px;font-family:inherit;outline:none}
.fc:focus{border-color:var(--p)}
textarea.fc{min-height:80px;resize:vertical}
.swatches{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .2s}
.sw.active{border-color:#333}
.set-btns{display:flex;flex-direction:column;gap:7px}

/* ── BUTTONS ── */
.btn{padding:7px 14px;background:var(--p);color:#fff;border:none;
  border-radius:var(--rs);font-size:13px;cursor:pointer;font-weight:600;
  transition:background .2s;white-space:nowrap}
.btn:hover{background:var(--pd)}
.btn:disabled{opacity:.5;cursor:wait}
.btn-out{padding:7px 14px;background:#fff;border:1px solid var(--bd);
  border-radius:var(--rs);font-size:13px;cursor:pointer;transition:all .2s}
.btn-out:hover{background:var(--bg)}
.btn-out.red{border-color:#FFCDD2;color:#f44336}
.btn-out.red:hover{background:#FFEBEE}
.btn-sm{padding:3px 8px;font-size:11px;border:1px solid var(--bd);border-radius:var(--rs);background:#fff;cursor:pointer}
.btn-sm.red{border-color:#FFCDD2;color:#f44336}
.btn-sm.red:hover{background:#FFEBEE}
.btn-block{width:100%;padding:9px;background:var(--p);color:#fff;border:none;
  border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer}
.btn-block:hover{background:var(--pd)}
.btn-row{display:flex;gap:7px;margin-top:14px}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;
  display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.overlay{align-items:center}}
.modal{background:#fff;border-radius:var(--r) var(--r) 0 0;width:100%;
  max-height:92vh;overflow-y:auto;padding:14px}
@media(min-width:600px){.modal{border-radius:var(--r);max-width:540px}}
.mhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mtitle{font-size:15px;font-weight:700}
.mclose{width:30px;height:30px;border:none;background:var(--bd);border-radius:50%;
  cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}

/* ── RECIPE DETAIL ── */
.det-img{width:100%;height:150px;border-radius:var(--rs);overflow:hidden;
  margin-bottom:10px;background:#E8F5E9;display:flex;align-items:center;justify-content:center;font-size:56px}
.det-img img{width:100%;height:100%;object-fit:cover}
.ing-list-d{list-style:none;margin-bottom:10px}
.ing-list-d li{padding:3px 0;border-bottom:1px solid var(--bd);font-size:12px;display:flex;gap:8px}
.ing-list-d li:last-child{border-bottom:none}
.ing-n{flex:1}.ing-a{color:var(--t2)}
.steps-d ol{padding-left:18px}
.steps-d li{margin-bottom:5px;font-size:12px}
.url-chip{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;
  background:#E3F2FD;color:#1565C0;border-radius:10px;font-size:10px}
.url-chip:hover{background:#BBDEFB}

/* ── RECIPE FORM ── */
.ing-rows{list-style:none;margin-bottom:6px}
.ing-row{display:flex;gap:5px;margin-bottom:5px;align-items:center}
.ing-row input{flex:1;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--rs);font-size:12px;outline:none}
.ing-row input:focus{border-color:var(--p)}
.step-rows{margin-bottom:6px}
.step-row{display:flex;gap:5px;margin-bottom:5px;align-items:flex-start}
.step-n{width:20px;height:20px;background:var(--p);color:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
  flex-shrink:0;margin-top:5px}
.step-row textarea{flex:1;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--rs);
  font-size:12px;resize:vertical;min-height:34px;font-family:inherit;outline:none}
.step-row textarea:focus{border-color:var(--p)}
.photo-label{width:100%;height:100px;border:2px dashed var(--bd);border-radius:var(--rs);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  position:relative;overflow:hidden}
.photo-label img{width:100%;height:100%;object-fit:cover}
.photo-ph{text-align:center;color:var(--t2)}
.photo-label input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ── MEAL EDIT (select boxes) ── */
.me-sel-row{background:var(--bg);border-radius:var(--rs);padding:9px 10px}
.me-sel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.me-sel-type{font-size:12px;font-weight:700;color:var(--pd)}
.me-sel-body{display:flex;align-items:center;gap:8px}
.me-thumb{width:44px;height:44px;border-radius:var(--rs);object-fit:cover;flex-shrink:0;cursor:pointer;border:1px solid var(--bd)}
.me-thumb-ph{width:44px;height:44px;font-size:22px;border-radius:var(--rs);
  background:#fff;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.me-select{flex:1;padding:8px 8px;border:1px solid var(--bd);border-radius:var(--rs);
  font-size:13px;background:#fff;cursor:pointer;outline:none;min-width:0}
.me-select:focus{border-color:var(--p)}
.me-view-btn{padding:4px 9px;font-size:11px;border:1px solid var(--p);
  color:var(--p);background:#fff;border-radius:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.me-view-btn:hover{background:var(--pl)}

/* ── HISTORY MODAL ── */
.hist-week{background:var(--bg);border-radius:var(--rs);padding:9px 12px;margin-bottom:8px;cursor:pointer;border:1px solid transparent}
.hist-week:hover{border-color:var(--p);background:var(--pl)}
.hist-label{font-size:12px;font-weight:700;margin-bottom:3px}
.hist-items{font-size:11px;color:var(--t2);line-height:1.4}
.hist-day-row{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.hist-day-cell{background:#fff;border-radius:4px;padding:4px 6px;font-size:10px}
.hist-day-cell .hdc-lbl{color:var(--t2);margin-bottom:1px;font-weight:600}
.hist-day-cell .hdc-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}

/* ── MISC ── */
.empty{text-align:center;padding:36px 16px;color:var(--t2)}
.empty .ei{font-size:44px;margin-bottom:10px}
.empty p{font-size:13px}
.warn{background:#FFF3E0;padding:9px 11px;border-radius:var(--rs);margin-bottom:10px;font-size:12px;color:#E65100}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:#323232;color:#fff;padding:9px 18px;border-radius:22px;font-size:13px;
  z-index:600;pointer-events:none;animation:tin .3s ease;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.divider{height:1px;background:var(--bd);margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;
  background:var(--pl);color:var(--pd);border-radius:10px;font-size:10px;font-weight:600}
</style>
</head>
<body>

<div class="hdr"><h1>🍱 献立アプリ</h1></div>
<div class="tabs">
  <div class="tab active" data-v="plan"     onclick="sw('plan')"    ><span class="ti">📅</span><span class="tl">献立</span></div>
  <div class="tab"        data-v="shopping" onclick="sw('shopping')" ><span class="ti">🛒</span><span class="tl">買い物</span></div>
  <div class="tab"        data-v="recipes"  onclick="sw('recipes')"  ><span class="ti">📖</span><span class="tl">レシピ帳</span></div>
  <div class="tab"        data-v="settings" onclick="sw('settings')" ><span class="ti">⚙️</span><span class="tl">設定</span></div>
</div>

<div class="view" id="mc"></div>
<button class="fab hidden" id="fab" onclick="openRF(null)">＋</button>
<div id="mwrap"></div>

<script>
// ═══ CONSTANTS ════════════════════════════════════════════════
const SK='kondate_v1', AKS='claude_api_key', THS='theme_color';
const MODEL='claude-haiku-4-5-20251001';
const API='https://api.anthropic.com/v1/messages';

const SLOTS=[
  {key:'main',lbl:'主菜',type:'主菜',e:'🍖'},
  {key:'side',lbl:'副菜',type:'副菜',e:'🥗'},
  {key:'rice',lbl:'ご飯',type:'ご飯',e:'🍚'},
  {key:'soup',lbl:'スープ',type:'スープ',e:'🍲'},
];
const DAYS=['月','火','水','木','金'];
const DAYSF=['月曜日','火曜日','水曜日','木曜日','金曜日'];
const TYPES=['主菜','副菜','ご飯','スープ'];
const EMOJ={主菜:'🍖',副菜:'🥗','ご飯':'🍚','スープ':'🍲'};
const BADGE={主菜:'b-main',副菜:'b-side','ご飯':'b-rice','スープ':'b-soup'};

const THEMES=[
  {n:'サーモン',v:'#F06060',d:'#C62828',l:'#FFCDD2',bg:'#FFF5F5'},
  {n:'グリーン', v:'#43A047',d:'#2E7D32',l:'#A5D6A7',bg:'#F1F8E9'},
  {n:'ブルー',   v:'#1E88E5',d:'#1565C0',l:'#90CAF9',bg:'#E3F2FD'},
  {n:'パープル', v:'#8E24AA',d:'#6A1B9A',l:'#CE93D8',bg:'#F3E5F5'},
  {n:'ピンク',   v:'#E91E63',d:'#880E4F',l:'#F48FB1',bg:'#FCE4EC'},
  {n:'ティール', v:'#00897B',d:'#004D40',l:'#80CBC4',bg:'#E0F2F1'},
  {n:'オレンジ', v:'#FB8C00',d:'#E65100',l:'#FFCC80',bg:'#FFF3E0'},
  {n:'ネイビー', v:'#3949AB',d:'#1A237E',l:'#9FA8DA',bg:'#E8EAF6'},
  {n:'オリーブ', v:'#7CB342',d:'#558B2F',l:'#C5E1A5',bg:'#F9FBE7'},
  {n:'ブラウン', v:'#6D4C41',d:'#4E342E',l:'#BCAAA4',bg:'#EFEBE9'},
];

const SHOP_CATS=['肉・魚','野菜・豆腐','乾物・加工品','調味料','その他'];
// 重要: SAUCE を MEAT より先に定義 — 「鶏がらスープの素」が肉・魚に分類されないよう
const SAUCE=['醤油','しょうゆ','みりん','砂糖','塩','酢','酒','みそ','味噌','油','ごま油','オリーブ','マヨネーズ','ケチャップ','ソース','だし','コンソメ','鶏がら','めんつゆ','ポン酢','ドレッシング','カレー粉','片栗粉','小麦粉','パン粉','ごま','胡椒','七味','わさび','からし','ナンプラー','オイスターソース','豆板醤','ラー油','バルサミコ','ハチミツ','蜂蜜','牛乳','バター','チーズ','生クリーム','ヨーグルト'];
const MEAT=['鶏','豚','牛','羊','ひき肉','ベーコン','ハム','ソーセージ','ウインナー','鮭','サバ','アジ','サンマ','ブリ','マグロ','タラ','エビ','イカ','タコ','ホタテ','アサリ','シジミ','ツナ','魚','肉','スパム'];
const VEG=['玉ねぎ','にんじん','キャベツ','大根','じゃがいも','ほうれん','ブロッコリー','トマト','なす','ピーマン','きゅうり','ねぎ','にんにく','しょうが','もやし','ごぼう','れんこん','さつまいも','かぼちゃ','アスパラ','セロリ','パプリカ','レタス','水菜','春菊','チンゲン','豆腐','油揚げ','厚揚げ','納豆','高野豆腐','おから','大豆','えのき','しめじ','しいたけ','なめこ','エリンギ','まいたけ','わかめ','ひじき','こんにゃく','卵','たまご'];
const DRY=['米','うどん','そば','パスタ','ラーメン','そうめん','春雨','マカロニ','パン','食パン','もち','缶','乾燥','干し'];
const NORMALIZE={
  'ネギ':'長ねぎ','ねぎ':'長ねぎ','葱':'長ねぎ','長ネギ':'長ねぎ','長葱':'長ねぎ',
  '小ネギ':'小ねぎ','万能ねぎ':'小ねぎ',
  'レンコン':'れんこん','蓮根':'れんこん',
  'ナス':'なす','茄子':'なす',
  '料理酒':'酒','清酒':'酒',
};

// ═══ STATE ════════════════════════════════════════════════════
let S={view:'plan',week:monday(new Date()),data:loadData(),chat:[],rf:null,_rbq:''};

// ═══ DATA ═════════════════════════════════════════════════════
function loadData(){
  try{return Object.assign(defData(),JSON.parse(localStorage.getItem(SK)||'{}'));}

// ═══ UTILS ════════════════════════════════════════════════════
function monday(d){
  const r=new Date(d),day=r.getDay();
  r.setDate(r.getDate()-(day===0?6:day-1));r.setHours(0,0,0,0);return r;
}
function wkey(d){return fmt(d);}
function fmt(d){return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function pad(n){return String(n).padStart(2,'0');}
function weekDays(mon){return Array.from({length:5},(_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d;});}
function isToday(d){const t=new Date();return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate();}
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rec(id){return S.data.recipes.find(r=>r.id===id);}
function weekLabel(){
  const ds=weekDays(S.week);
  return`${ds[0].getMonth()+1}/${ds[0].getDate()}（月）〜${ds[4].getMonth()+1}/${ds[4].getDate()}（金）`;
}
function theme(){const v=localStorage.getItem(THS)||'#43A047';return THEMES.find(t=>t.v===v)||THEMES[1];}
function applyTheme(t){
  const r=document.documentElement.style;
  r.setProperty('--p',t.v);r.setProperty('--pd',t.d);r.setProperty('--pl',t.l);r.setProperty('--bg',t.bg);
  // --primary / --primary-light aliases for external use
  r.setProperty('--primary',t.v);r.setProperty('--primary-dark',t.d);r.setProperty('--primary-light',t.l);
}
function toast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),2400);
}

// ─ Amount combining
function cleanAmt(s){return(s||'').replace(/くらい|ほど|程度|前後|以上|未満/g,'').trim();}
function parseAmt(s){
  s=(s||'').trim();
  // 大さじ/小さじ/カップ N（とN/N)?
  const m1=s.match(/^(大さじ|小さじ|カップ)\s*([\d\.]+(?:と[\d\.]+\/[\d\.]+)?)/);
  if(m1){
    let num;
    const tw=m1[2].match(/^([\d\.]+)と([\d\.]+)\/([\d\.]+)$/);
    if(tw)num=parseFloat(tw[1])+parseFloat(tw[2])/parseFloat(tw[3]);
    else num=parseFloat(m1[2]);
    if(!isNaN(num))return{num,unit:m1[1],style:'tbs',pre:m1[1],suf:''};
  }
  // plain number + unit
  const m2=s.match(/^([\d\.]+(?:\/[\d\.]+)?)\s*(.*)$/);
  if(!m2)return null;
  let num;
  if(m2[1].includes('/')){const p=m2[1].split('/');num=parseFloat(p[0])/parseFloat(p[1]);}
  else num=parseFloat(m2[1]);
  const unit=m2[2].trim();
  return isNaN(num)?null:{num,unit,style:'nf',pre:'',suf:unit};
}
function fmtNum(n){
  const r=Math.round(n*100)/100;
  if(Number.isInteger(r))return String(r);
  const halves=[[0.5,'1/2'],[0.25,'1/4'],[0.75,'3/4'],[1/3,'1/3'],[2/3,'2/3']];
  const frac=Math.round((r%1)*100)/100;
  const whole=Math.floor(r);
  for(const[v,s]of halves){if(Math.abs(frac-v)<0.01){return whole?`${whole}と${s}`:s;}}
  return String(Math.round(r*10)/10);
}
function mergeAmts(arr){
  if(!arr.length)return'';
  if(arr.length===1)return cleanAmt(arr[0]);
  const cleaned=arr.map(cleanAmt);
  const ps=cleaned.map(parseAmt);
  if(ps.every(p=>p&&p.style===ps[0].style&&p.unit===ps[0].unit)){
    const tot=ps.reduce((s,p)=>s+p.num,0);
    return ps[0].style==='nf'?`${fmtNum(tot)}${ps[0].unit}`:`${ps[0].pre}${fmtNum(tot)}${ps[0].suf}`;
  }
  return cleaned.filter(Boolean).join('・');
}

// ─ Category classification
function categorizeLine(text){
  if(SAUCE.some(k=>text.includes(k)))return'調味料';
  if(MEAT.some(k=>text.includes(k)))return'肉・魚';
  if(VEG.some(k=>text.includes(k)))return'野菜・豆腐';
  if(DRY.some(k=>text.includes(k)))return'乾物・加工品';
  return'その他';
}
function catOf(name,wk){
  if(S.data.catOverrides[wk]?.[name])return S.data.catOverrides[wk][name];
  return categorizeLine(name);
}
function parseIngredient(ing){
  if(!ing)return{name:'',amount:''};
  if(ing.includes('...')){
    const idx=ing.indexOf('...');
    return{name:ing.slice(0,idx).trim(),amount:ing.slice(idx+3).trim()};
  }
  const m1=ing.match(/^(.+?)\s+((?:大さじ|小さじ|カップ)\s*[\d\/\.]+(?:と[\d\/\.]+\/[\d\/\.]+)?)(\s+.*)?$/);
  if(m1)return{name:m1[1].trim(),amount:(m1[2]+(m1[3]||'')).trim()};
  const m2=ing.match(/^(.+?)\s+([\d\/\.〜～]+\s*(?:g|kg|ml|cc|本|個|枚|袋|缶|丁|束|株|切れ|合|片|玉|尾|杯|つ|パック)(?:くらい|ほど|程度)?)$/);
  if(m2)return{name:m2[1].trim(),amount:m2[2].trim()};
  const m3=ing.match(/^([^\d]+?)\s+([\d].+)$/);
  if(m3&&m3[1].length<=15)return{name:m3[1].trim(),amount:m3[2].trim()};
  return{name:ing.trim(),amount:''};
}
function parseIng(s){return parseIngredient(s);}

function updateMeSlot(wk,i,sk,rid){
  if(!S.data.plans[wk])S.data.plans[wk]={};
  if(!S.data.plans[wk][i])S.data.plans[wk][i]={};
  if(rid){
    S.data.plans[wk][i][sk]=rid;
    if(!S.data.history[wk])S.data.history[wk]=[];
    if(!S.data.history[wk].includes(rid))S.data.history[wk].push(rid);
  }else{
    delete S.data.plans[wk][i][sk];
  }
  save();
  render(); // refresh plan view behind modal
  // Update thumbnail & detail button in-place (no modal re-open)
  const sl=SLOTS.find(s=>s.key===sk);
  const r=rid?rec(rid):null;
  const thumbWrap=document.getElementById(`thumb-${i}-${sk}`);
  const vbtn=document.getElementById(`vbtn-${i}-${sk}`);
  if(thumbWrap){
    thumbWrap.innerHTML=r?.photo
      ?`<img class="me-thumb" src="${r.photo}" onclick="openDet('${r.id}')">`
      :`<div class="me-thumb-ph">${sl.e}</div>`;
  }
  if(vbtn){
    if(rid){vbtn.style.display='';vbtn.setAttribute('onclick',`openDet('${rid}')`);}
    else vbtn.style.display='none';
  }
}

// ─ History Modal (past 1 year, viewable)
function openHistory(){
  const curWk=wkey(S.week);
  // Build list of weeks that have plan data, up to 52 weeks back
  const weeks=[];
  for(let i=0;i<52;i++){
    const d=new Date(S.week);d.setDate(d.getDate()-i*7);
    const wk=wkey(monday(d));
    const plan=S.data.plans[wk];
    if(!plan)continue;
    const hasData=Object.values(plan).some(dp=>Object.keys(dp).length>0);
    if(hasData)weeks.push(wk);
  }

  let h=`<div class="mhdr">
    <span class="mtitle">📋 献立履歴（過去1年）</span>
    <button class="mclose" onclick="closeM()">✕</button>
  </div>
  <div style="max-height:75vh;overflow-y:auto;padding-right:2px">`;

  if(!weeks.length){
    h+=`<div class="empty"><div class="ei">📋</div><p>履歴がありません</p>
      <p style="margin-top:6px">献立を設定すると履歴が記録されます</p></div>`;
  }else{
    // Group by month
    let lastMonth='';
    weeks.forEach(wk=>{
      const d=new Date(wk),days=weekDays(d),plan=S.data.plans[wk]||{};
      const isCur=wk===curWk;
      const monthKey=`${d.getFullYear()}年${d.getMonth()+1}月`;
      if(monthKey!==lastMonth){
        h+=`<div style="font-size:11px;font-weight:700;color:var(--t2);padding:6px 2px 2px">${monthKey}</div>`;
        lastMonth=monthKey;
      }
      let mealCount=0;const names=[];
      for(let i=0;i<5;i++){
        Object.values(plan[i]||{}).forEach(rid=>{const r=rec(rid);if(r){mealCount++;names.push(r.name);}});
      }
      h+=`<div class="hist-week" onclick="openHistDetail('${wk}')">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="hist-label">${d.getDate()}日週${isCur?' <span class="chip">今週</span>':''}</span>
          <span style="font-size:10px;color:var(--t2)">${mealCount}品 ▶</span>
        </div>
        <div class="hist-items">${names.slice(0,6).join('・')+(names.length>6?'…':'')}</div>
      </div>`;
    });
  }
  h+=`</div>`;
  openM(h);
}

// Collect recipe IDs used in current + past 2 weeks
function getRecentUsedIds(){
  const ids=new Set();
  const now=monday(new Date());
  for(let w=0;w<3;w++){
    const d=new Date(now);d.setDate(d.getDate()-w*7);
    const wk=wkey(d);
    (S.data.history[wk]||[]).forEach(id=>ids.add(id));
    const plan=S.data.plans[wk]||{};
    for(const dp of Object.values(plan))
      for(const rid of Object.values(dp))if(rid)ids.add(rid);
  }
  return ids;
}

async function execGen(){
  const pref=(document.getElementById('gen-pref')?.value||'').trim();
  const btn=document.getElementById('gen-exec-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> 生成中（最大20枠）...';}

  // Build recipe list by type with IDs
  const byType={};
  TYPES.forEach(t=>{byType[t]=[];});
  S.data.recipes.forEach(r=>{if(byType[r.type])byType[r.type].push({id:r.id,name:r.name});});

  const usedIds=[...getRecentUsedIds()];

  const prompt=`登録済みレシピのIDを使って、今週月〜金5日分×4品（主菜・副菜・ご飯・スープ）= 最大20枠の献立を組み立ててください。

## 登録済みレシピ（typeごと）
${JSON.stringify(byType)}

## 過去2週間で使用済みのID（できるだけ避けてください）
${JSON.stringify(usedIds)}

${pref?`## ユーザーの希望\n${pref}`:''}

## 出力フォーマット（JSONのみ、説明不要）
{
  "0":{"main":"レシピID","side":"レシピID","rice":"レシピID","soup":"レシピID"},
  "1":{"main":"..."},
  "2":{"main":"..."},
  "3":{"main":"..."},
  "4":{"main":"..."}
}
キー0=月、1=火、2=水、3=木、4=金。
存在するレシピIDのみ使うこと。そのtypeのレシピがない場合はそのキーを省略。`;

  try{
    const reply=await callClaude([{role:'user',content:prompt}],'献立アシスタントです。JSONのみで回答してください。');
    const m=reply.match(/\{[\s\S]*\}/);
    if(!m)throw new Error('JSONが見つかりません');
    const data=JSON.parse(m[0]);

    // Validate IDs
    const validIds=new Set(S.data.recipes.map(r=>r.id));
    let setCount=0;
    for(const dp of Object.values(data))
      for(const rid of Object.values(dp))
        if(validIds.has(rid))setCount++;

    window._genData=data;

    // Build preview
    let rhtml=`<div style="margin-bottom:8px;font-size:13px;font-weight:600">生成された献立（${setCount}/20枠）:</div>
    <div style="display:flex;flex-direction:column;gap:6px">`;
    for(let i=0;i<5;i++){
      const dp=data[String(i)]||{};
      rhtml+=`<div style="background:var(--bg);border-radius:var(--rs);padding:8px 10px">
        <div style="font-size:11px;font-weight:700;color:var(--p);margin-bottom:3px">${DAYS[i]}曜日</div>`;
      SLOTS.forEach(sl=>{
        const r=dp[sl.key]?rec(dp[sl.key]):null;
        rhtml+=`<div style="display:flex;gap:6px;font-size:11px;padding:1px 0">
          <span style="color:var(--t2);min-width:30px">${sl.lbl}</span>
          <span style="font-weight:${r?600:400};color:${r?'var(--text)':'var(--t2)'}">${r?r.name:'─'}</span>
        </div>`;
      });
      rhtml+=`</div>`;
    }
    rhtml+=`</div><button class="btn-block" style="margin-top:10px" onclick="applyGen()">この献立を適用する</button>`;
    const res=document.getElementById('gen-result');
    if(res)res.innerHTML=rhtml;
  }catch(e){
    const res=document.getElementById('gen-result');
    if(res)res.innerHTML=`<div class="warn">エラー: ${esc(e.message)}</div>`;
  }
  if(btn){btn.disabled=false;btn.textContent='🍽 再生成する';}
}

function applyGen(){
  const data=window._genData;if(!data)return;
  const wk=wkey(S.week);
  if(!S.data.plans[wk])S.data.plans[wk]={};
  const validIds=new Set(S.data.recipes.map(r=>r.id));
  for(let i=0;i<5;i++){
    const dp=data[String(i)];if(!dp)continue;
    if(!S.data.plans[wk][i])S.data.plans[wk][i]={};
    for(const[sk,rid]of Object.entries(dp)){
      if(rid&&validIds.has(rid)){
        S.data.plans[wk][i][sk]=rid;
        if(!S.data.history[wk])S.data.history[wk]=[];
        if(!S.data.history[wk].includes(rid))S.data.history[wk].push(rid);
      }
    }
  }
  save();closeM();render();toast('献立を適用しました');
}

// ─ OCR: 写真からレシピを読み取る
async function ocrImage(file){
  if(!localStorage.getItem(AKS)){toast('APIキーを設定してください');return;}
  const btn=document.getElementById('ocr-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin" style="border-color:rgba(0,0,0,.15);border-top-color:var(--p)"></span> 読み取り中...';}
  try{
    // Resize to ≤800px, quality 0.7
    const b64=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=ev=>{
        const img=new Image();
        img.onload=()=>{
          const MAX=800,c=document.createElement('canvas');
          let w=img.width,h=img.height;
          if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}
          else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
          c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          resolve(c.toDataURL('image/jpeg',.7).split(',')[1]);
        };
        img.onerror=reject;img.src=ev.target.result;
      };
      reader.onerror=reject;reader.readAsDataURL(file);
    });
    const msg={role:'user',content:[
      {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
      {type:'text',text:`このレシピ画像を読み取り、以下のJSONのみで返してください:
{"name":"料理名","type":"主菜|副菜|ご飯|スープ","ingredients":["食材名 ... 分量"],"steps":["手順テキスト"]}
typeは必ず主菜/副菜/ご飯/スープのいずれかにしてください。JSONのみ返してください。`}
    ]};
    const reply=await callClaude([msg],'レシピ画像解析アシスタントです。JSONのみで返答してください。');
    const m=reply.match(/\{[\s\S]*\}/);
    if(!m)throw new Error('レシピを読み取れませんでした');
    const d=JSON.parse(m[0]);
    // Fill form
    const nameEl=document.getElementById('rf-n'),typeEl=document.getElementById('rf-t');
    if(nameEl&&d.name)nameEl.value=d.name;
    if(typeEl&&TYPES.includes(d.type))typeEl.value=d.type;
    if(d.ingredients?.length){S.rf.ingredients=d.ingredients.filter(s=>s.trim());rebuildIng();}
    if(d.steps?.length){S.rf.steps=d.steps.filter(s=>s.trim());rebuildStep();}
    toast(`「${d.name||'レシピ'}」を読み取りました`);
  }catch(e){toast('読み取りエラー: '+e.message);}
  if(btn){btn.disabled=false;btn.innerHTML='📄 別の写真を読み取る';}
}

// ═══ SHOPPING VIEW ════════════════════════════════════════════
function vShop(){
  const wk=wkey(S.week),plan=S.data.plans[wk]||{};
  const chk=S.data.checked[wk]||{},del=S.data.deleted[wk]||{};
  const manual=S.data.manualItems[wk]||[];

  // Aggregate ingredients with combined amounts (apply NORMALIZE for dedup)
  const ings={};
  Object.values(plan).forEach(dp=>{
    Object.values(dp).forEach(rid=>{
      const r=rec(rid);if(!r)return;
      (r.ingredients||[]).forEach(s=>{
        const{name:rawName,amount}=parseIngredient(s);if(!rawName)return;
        const name=NORMALIZE[rawName]||rawName;
        if(!ings[name])ings[name]=[];
        if(amount)ings[name].push(amount);
      });
    });
  });

  // Build grouped items
  const grp={};
  SHOP_CATS.forEach(c=>{grp[c]=[];});
  for(const[name,amts]of Object.entries(ings)){
    if(del[name])continue;
    const cat=catOf(name,wk);
    if(!grp[cat])grp[cat]=[];
    grp[cat].push({type:'auto',name,amt:mergeAmts(amts)});
  }
  manual.filter(m=>!del[m.id]).forEach(m=>{
    const cat=catOf(m.name,wk)||'その他';
    if(!grp[cat])grp[cat]=[];
    grp[cat].push({type:'manual',id:m.id,name:m.name,amt:m.amount});
  });

  const total=Object.values(grp).flat().length;
  const done=Object.values(chk).filter(Boolean).length;

  let h=`<div class="shop-top">
    <h2>🛒 買い物リスト</h2>
    <div class="shop-top-r">
      <span class="progress-text">${done}/${total}</span>
      <button class="btn-out" style="font-size:11px;padding:4px 8px" onclick="resetChk('${wk}')">リセット</button>
    </div>
  </div>`;

  const filled=SHOP_CATS.filter(c=>grp[c]?.length);
  if(!filled.length){
    h+=`<div class="empty"><div class="ei">🛒</div><p>献立を設定すると<br>材料が自動で追加されます</p></div>`;
  }else{
    filled.forEach(cat=>{
      const items=grp[cat];
      h+=`<div class="cat-sec">
        <div class="cat-hdr"><span>${cat}</span><span style="font-size:11px">${items.length}品</span></div>`;
      items.forEach(item=>{
        const key=item.type==='manual'?item.id:item.name;
        const isc=!!chk[key];
        const catOpts=SHOP_CATS.map(c=>`<option value="${c}"${c===cat?' selected':''}>${c}</option>`).join('');
        h+=`<div class="shop-row${isc?' done':''}">
          <input type="checkbox"${isc?' checked':''} onchange="toggleChk('${wk}','${key}',this.checked)">
          <span class="sname">${item.name}</span>
          ${item.amt?`<span class="samt">${item.amt}</span>`:''}
          <select class="scat-sel" onchange="changeItemCat('${wk}','${item.name}',this.value)"
            title="カテゴリ変更">${catOpts}</select>
          <button class="sdel" onclick="delShopItem('${wk}','${key}',${item.type==='manual'})">🗑</button>
        </div>`;
      });
      h+=`</div>`;
    });
  }

  h+=`<div class="add-row">
    <h3>＋ 手動で食材を追加</h3>
    <div class="add-form">
      <input type="text" id="mn-n" placeholder="食材名">
      <input type="text" id="mn-a" placeholder="量（例: 1丁）" style="max-width:110px">
      <button class="btn" onclick="addManual('${wk}')">追加</button>
    </div>
  </div>`;

  return h;
}

function toggleChk(wk,key,v){
  if(!S.data.checked[wk])S.data.checked[wk]={};
  S.data.checked[wk][key]=v;save();
  // Update progress text without full re-render
  const chk=S.data.checked[wk]||{};
  const allItems=document.querySelectorAll('.shop-row');
  const total=allItems.length;
  const done=Object.values(chk).filter(Boolean).length;
  const pt=document.querySelector('.progress-text');
  if(pt)pt.textContent=`${done}/${total}`;
  const row=document.querySelector(`input[onchange*="'${key}'"]`)?.closest('.shop-row');
  if(row)row.classList.toggle('done',v);
}
function delShopItem(wk,key,isManual){
  if(isManual){if(S.data.manualItems[wk])S.data.manualItems[wk]=S.data.manualItems[wk].filter(m=>m.id!==key);}
  else{if(!S.data.deleted[wk])S.data.deleted[wk]={};S.data.deleted[wk][key]=true;}
  save();render();
}
function changeItemCat(wk,name,cat){
  if(!S.data.catOverrides[wk])S.data.catOverrides[wk]={};
  S.data.catOverrides[wk][name]=cat;
  save();render();
}
function addManual(wk){
  const name=(document.getElementById('mn-n')?.value||'').trim();
  if(!name){toast('食材名を入力してください');return;}
  if(!S.data.manualItems[wk])S.data.manualItems[wk]=[];
  S.data.manualItems[wk].push({id:'m'+uid(),name,amount:(document.getElementById('mn-a')?.value||'').trim()});
  save();render();toast('追加しました');
}
function resetChk(wk){S.data.checked[wk]={};save();render();toast('リセットしました');}

function searchRecs(q){

  return S.data.recipes.filter(r=>{
    const ing=(r.ingredients||[]).join(' ');

function uploadPh(e){
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'),MAX=480;
      let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=h*MAX/w;w=MAX;}}else{if(h>MAX){w=w*MAX/h;h=MAX;}}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      const data=c.toDataURL('image/jpeg',.72);
      S.rf.photo=data;
      const lbl=document.getElementById('ph-lbl');
      if(lbl)lbl.innerHTML=`<img src="${data}"><input type="file" accept="image/*" onchange="uploadPh(event)">`;
    };img.src=ev.target.result;
  };reader.readAsDataURL(f);
}

async function aiGenerateRecipes(){
  const ak=localStorage.getItem(AKS);
  if(!ak){toast('APIキーを設定してください');sw('settings');return;}
  const btn=document.getElementById('ai-recipe-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> 生成中...';}
  try{
    const existingNames=S.data.recipes.map(r=>r.name);
    const existingSet=new Set(existingNames.map(n=>n.trim()));
    const prompt=`日本の定番家庭料理レシピを10品、2人分で生成してください。
主菜3品・副菜3品・ご飯2品・スープ2品のバランスで作成してください。

既存レシピ（重複させないでください）: ${existingNames.join('、')||'なし'}

各レシピの要件:
- 一般的な家庭で作れる定番料理
- 材料は6〜10品、「食材名 ... 分量」の形式（例: 鶏もも肉 ... 300g）
- 作り方は3〜6手順、具体的に記述

以下のJSONのみで返してください（他のテキスト不要）:
{"recipes":[
  {"name":"料理名","type":"主菜","ingredients":["食材 ... 分量"],"steps":["手順の詳細"]},
  ...10品...
]}
typeは「主菜」「副菜」「ご飯」「スープ」のいずれか。`;
    const reply=await callClaude([{role:'user',content:prompt}],'JSONのみで回答してください。');
    const m=reply.match(/\{[\s\S]*\}/);if(!m)throw new Error('JSONが見つかりません');
    const data=JSON.parse(m[0]);
    let added=0;
    (data.recipes||[]).forEach(r=>{
      if(!r.name)return;
      const name=r.name.trim();
      if(existingSet.has(name))return; // duplicate check
      if(!TYPES.includes(r.type))return;
      S.data.recipes.push({id:'r'+uid(),name,type:r.type,url:'',photo:null,
        ingredients:(r.ingredients||[]).filter(s=>s.trim()),
        steps:(r.steps||[]).filter(s=>s.trim())});
      existingSet.add(name);
      added++;
    });
    save();render();toast(`${added}件のレシピを追加しました`);
  }catch(e){
    toast('エラー: '+e.message);
  }
  if(btn){btn.disabled=false;btn.textContent='✨ 人気レシピを10品追加';}
}

function showSyncExport(){
  // Format mirrors localStorage keys directly for easy restore
  const payload=JSON.stringify({
    [SK]:JSON.stringify(S.data),
    [AKS]:localStorage.getItem(AKS)||'',
    [THS]:localStorage.getItem(THS)||'',
  });
  const b64=btoa(unescape(encodeURIComponent(payload)));
  openM(`<div class="mhdr"><span class="mtitle">📤 同期テキスト</span><button class="mclose" onclick="closeM()">✕</button></div>
    <p style="font-size:12px;color:var(--t2);margin-bottom:8px">以下のテキストをコピーして別のデバイスに貼り付けてください</p>
    <textarea class="fc" id="sync-txt" rows="5" onclick="this.select()">${b64}</textarea>
    <button class="btn-block" style="margin-top:8px" onclick="copySync()">📋 コピー</button>`);
}
function copySync(){
  const t=document.getElementById('sync-txt');if(!t)return;
  t.select();document.execCommand('copy');toast('コピーしました');
}
function syncImport(){
  const raw=(document.getElementById('sync-paste')?.value||'').trim();
  if(!raw){toast('テキストを貼り付けてください');return;}
  try{
    const payload=JSON.parse(decodeURIComponent(escape(atob(raw))));
    // New format: {kondate_v1:"...", claude_api_key:"...", theme_color:"..."}
    // Old format fallback: {data:{...}, theme:"...", apiKey:"..."}
    if(payload[SK]){
      localStorage.setItem(SK,payload[SK]);
      if(payload[AKS])localStorage.setItem(AKS,payload[AKS]);
      if(payload[THS])localStorage.setItem(THS,payload[THS]);
      S.data={...defData(),...JSON.parse(payload[SK])};
    }else if(payload.data?.recipes){
      S.data={...defData(),...payload.data};
      if(payload.theme)localStorage.setItem(THS,payload.theme);
      if(payload.apiKey)localStorage.setItem(AKS,payload.apiKey);
      save();
    }else{throw new Error('不正なデータ');}
    applyTheme(theme());render();toast('インポートしました');
  }catch(e){toast('インポートに失敗しました: '+e.message);}
}

function exportJSON(){
  // Backup format: {kondate_v1: "JSON文字列", claude_api_key: "...", theme_color: "..."}
  const payload={
    [SK]:JSON.stringify(S.data),
    [AKS]:localStorage.getItem(AKS)||'',
    [THS]:localStorage.getItem(THS)||'',
    exportedAt:new Date().toISOString(),
  };
  const b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=`kondate_${fmt(new Date())}.json`;a.click();URL.revokeObjectURL(a.href);
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const payload=JSON.parse(ev.target.result);
      // New format
      if(payload[SK]){
        localStorage.setItem(SK,payload[SK]);
        if(payload[AKS])localStorage.setItem(AKS,payload[AKS]);
        if(payload[THS])localStorage.setItem(THS,payload[THS]);
        S.data={...defData(),...JSON.parse(payload[SK])};
      // Old format fallback
      }else if(payload.data?.recipes||payload.recipes){
        const d=payload.data||payload;
        S.data={...defData(),...d};
        if(payload.theme)localStorage.setItem(THS,payload.theme);
        if(payload.apiKey)localStorage.setItem(AKS,payload.apiKey);
        save();
      }else{throw new Error('不正なデータ');}
      applyTheme(theme());render();toast('バックアップを復元しました');
    }catch(e){toast('復元に失敗しました: '+e.message);}
  };r.readAsText(f);
}
function clearAll(){
  if(!confirm('全データを削除しますか？この操作は取り消せません。'))return;
  S.data=defData();save();render();toast('削除しました');
}

// ═══ CLAUDE API ════════════════════════════════════════════════
async function callClaude(msgs,sys){
  const ak=localStorage.getItem(AKS);
  if(!ak)throw new Error('APIキーが未設定です');
  const res=await fetch(API,{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':ak,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:MODEL,max_tokens:4096,
      system:sys||'あなたは家庭料理の献立アシスタントです。日本語で回答してください。',
      messages:msgs}),
  });
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`APIエラー(${res.status})`);}
  return(await res.json()).content[0].text;
}

  document.getElementById('mwrap').innerHTML=
    `<div class="overlay" onclick="if(event.target===this)closeM()"><div class="modal">${html}</div></div>`;
}
function closeM(){document.getElementById('mwrap').innerHTML='';}

applyTheme(theme());render();
